name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # Dependency bots only change package.json and package-lock.json, but the vis-network
  # bundle in resources/visNetwork/ is committed. Install without scripts so the committed
  # files are not overwritten by the postinstall step before they are compared.
  vis-network-bundle:

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies without running postinstall
        run: npm ci --ignore-scripts

      - name: Check the committed vis-network bundle matches package.json
        run: npm run libs:check

  test:

    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - mediawiki_version: '1.43'
            smw_version: 6.0.1
            php_version: 8.3
            database_type: mysql
            database_image: "mariadb:11.2"
            coverage: false
            experimental: false
          - mediawiki_version: '1.43'
            smw_version: 7.2.0
            php_version: 8.3
            database_type: mysql
            database_image: "mariadb:11.2"
            coverage: true
            experimental: false
          - mediawiki_version: '1.46'
            smw_version: 7.2.0
            php_version: 8.5
            database_type: mysql
            database_image: "mariadb:12.3"
            coverage: false
            experimental: false

    env:
      MW_VERSION: ${{ matrix.mediawiki_version }}
      SMW_VERSION: ${{ matrix.smw_version }}
      PHP_VERSION: ${{ matrix.php_version }}
      DB_TYPE: ${{ matrix.database_type }}
      DB_IMAGE: ${{ matrix.database_image }}
      # Run JS tests only for the coverage entry: keeps the JS toolchain off the
      # other matrix legs, matching how PHP coverage is scoped to one leg too.
      NODE_JS: ${{ matrix.coverage && '1' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
                   
      - name: Update submodules
        run: git submodule update --init --remote

      - name: Run tests
        run: make ci
        if: matrix.coverage == false

      # The browser tests run on the runner against the wiki of the coverage leg. The CI stack
      # does not publish a port, but build/Makefile picks up this override file automatically.
      - name: Publish the wiki port for the browser tests
        run: |
          printf 'services:\n  wiki:\n    ports:\n      - 8080:8080\n' > build/docker-compose.override.yml
        if: matrix.coverage == true

      - name: Run tests with coverage
        run: mkdir -p build/coverage && make ci-coverage
        if: matrix.coverage == true

      - name: Upload code coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: SemanticMediaWiki/KnowledgeGraph
          files: build/coverage/php/coverage.xml,build/coverage/js/clover.xml
          disable_search: true
        if: matrix.coverage == true

      - name: Seed the wiki for the browser tests
        run: tests/e2e/seed-wiki.sh knowledgegraph-${{ matrix.database_type }}-wiki-1
        if: matrix.coverage == true

      - name: Install the browser tests
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium
        if: matrix.coverage == true

      - name: Run the browser tests
        working-directory: tests/e2e
        run: npx playwright test
        if: matrix.coverage == true

      - name: Upload the browser test report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
        if: failure() && matrix.coverage == true
