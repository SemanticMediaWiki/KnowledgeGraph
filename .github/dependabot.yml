# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # eslint-config-wikimedia does not support eslint 10 yet (npm ERESOLVE)
      - dependency-name: "eslint"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: "github-actions"
    directory: "/" # Dependabot scans .github/workflows from the root
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/tests/e2e" # Browser tests have their own package.json
    schedule:
      interval: "weekly"
